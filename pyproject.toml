[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokersim"
version = "0.1.0"
description = "Simulator and trainer for low-stakes live poker, played against realistic flawed bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "eval7>=0.1.10",
    "pokerkit>=0.7.8,<0.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx>=0.27",
    "httpx2>=2.0",  # newer Starlette TestClient wants this and warns without it
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pokersim"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # PokerKit warns when chips would be burned or a fold is pointless, so any warning fails
    "error",
    # eval7 calls pyparsing methods that newer pyparsing deprecates; nothing for us to fix
    "ignore:.*deprecated - use.*:Warning:eval7",
]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src/pokersim"]

[tool.ruff.lint.per-file-ignores]
# the chart tools are scripts: long docstrings and dense one-liners are fine
"tools/*" = ["E501"]
